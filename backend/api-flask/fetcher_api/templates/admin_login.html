<!DOCTYPE html>
<html>
<head><title>Recolekt Admin</title></head>
<body style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#0a0a0a;">
    <div style="text-align:center;color:white;">
        <h2 style="margin-bottom:24px;">🔐 Recolekt Admin</h2>
        <form method="GET">
            <input name="key" type="password" placeholder="Enter admin key"
                style="padding:10px 16px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:white;font-size:16px;margin-right:8px;outline:none;" />
            <button type="submit"
                style="padding:10px 20px;border-radius:8px;background:#6366f1;color:white;border:none;font-size:16px;cursor:pointer;">
                Enter
            </button>
        </form>
    </div>
</body>
</html>
