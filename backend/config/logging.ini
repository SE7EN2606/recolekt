[loggers]
keys=root,api,transcription,summarization,classification,video_analysis,storage

[handlers]
keys=consoleHandler,fileHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=consoleHandler

[logger_api]
level=INFO
handlers=consoleHandler,fileHandler
qualname=api
propagate=0

[logger_transcription]
level=INFO
handlers=consoleHandler,fileHandler
qualname=transcription
propagate=0

[logger_summarization]
level=INFO
handlers=consoleHandler,fileHandler
qualname=summarization
propagate=0

[logger_classification]
level=INFO
handlers=consoleHandler,fileHandler
qualname=classification
propagate=0

[logger_video_analysis]
level=INFO
handlers=consoleHandler,fileHandler
qualname=video_analysis
propagate=0

[logger_storage]
level=INFO
handlers=consoleHandler,fileHandler
qualname=storage
propagate=0

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=simpleFormatter
args=('summarizer.log',)

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
