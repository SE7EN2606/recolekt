[build]
  base = "frontend"
  command = "npm ci && npm run build"
  publish = "dist"

# Keep: redirect old Netlify subdomain to the custom domain
[[redirects]]
  from = "https://recolekt-front.netlify.app/*"
  to = "https://recolekt.app/:splat"
  status = 301
  force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
