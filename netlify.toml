[build]
base = "frontend"
command = "npm run build"
publish = "frontend/dist"

[[headers]]
for = "/assets/*.js"
[headers.values]
Content-Type = "application/javascript; charset=utf-8"

[[headers]]
for = "/assets/*.css"
[headers.values]
Content-Type = "text/css; charset=utf-8"

# 1. Redirect Netlify subdomain to custom domain
[[redirects]]
from = "https://recolekt-front.netlify.app/*"
to = "https://recolekt.app/:splat"
status = 301
force = true

# 2. PROXY API TO RAILWAY (MUST be before SPA fallback)
[[redirects]]
from = "/api/*"
to = "https://api.recolekt.app/api/:splat"
status = 200
force = true

# 3. SPA fallback for React Router (MUST be last)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
