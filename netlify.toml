[build]
base = "frontend"
command = "npm run build"
publish = "frontend/dist"

[[headers]]
for = "/assets/*.js"
[headers.values]
Content-Type = "application/javascript; charset=utf-8"

[[headers]]
for = "/assets/*.css"
[headers.values]
Content-Type = "text/css; charset=utf-8"

# Redirect Netlify subdomain to custom domain
[[redirects]]
from = "https://recolekt-front.netlify.app/*"
to = "https://recolekt.app/:splat"
status = 301
force = true

# SPA fallback for React Router
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
