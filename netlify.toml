[build]
base = "frontend"
command = "npm run build"
publish = "dist"

[[headers]]
for = "/"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/index.html"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/*.html"
[headers.values]
Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
for = "/assets/*.js"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Content-Type = "application/javascript; charset=utf-8"
X-Content-Type-Options = "nosniff"

[[headers]]
for = "/assets/*.css"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
Content-Type = "text/css; charset=utf-8"
X-Content-Type-Options = "nosniff"

# 1. Redirect Netlify subdomain to custom domain
[[redirects]]
from = "https://recolekt-front.netlify.app/*"
to = "https://recolekt.app/:splat"
status = 301
force = true

# 2. PROXY API TO RAILWAY (MUST be before SPA fallback)
[[redirects]]
from = "/api/*"
to = "https://api.recolekt.app/api/:splat"
status = 200
force = true

# 3. Missing static assets must 404, not fall through to the SPA fallback.
[[redirects]]
from = "/assets/*"
to = "/404.html"
status = 404

# 4. SPA fallback for React Router (MUST be last)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
