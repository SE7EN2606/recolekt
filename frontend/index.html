<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Recolekt</title>
    <script>
      (function () {
        var isIOS =
          /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" &&
            navigator.maxTouchPoints > 1);

        var isStandalone =
          window.matchMedia("(display-mode: standalone)").matches ||
          window.navigator.standalone === true;

        if (isIOS && isStandalone) {
          document.documentElement.classList.add("is-ios-standalone-pwa");
        }

        var reloadKey = "recolekt:pwa-viewport-reload:v1";

        function debugViewport(payload) {
          try {
            if (localStorage.getItem("recolekt:pwaDebug") === "1") {
              console.log("[Recolekt PWA viewport]", payload);
            }
          } catch (error) {
            /* Ignore storage access errors during bootstrap diagnostics. */
          }
        }

        function getReloadGuardPresent() {
          try {
            return sessionStorage.getItem(reloadKey) === "1";
          } catch (error) {
            return true;
          }
        }

        function setReloadGuard() {
          try {
            sessionStorage.setItem(reloadKey, "1");
            return true;
          } catch (error) {
            return false;
          }
        }

        function clearReloadGuard() {
          try {
            sessionStorage.removeItem(reloadKey);
          } catch (error) {
            /* Ignore storage access errors. */
          }
        }

        function stabilizeStandaloneViewport() {
          var standaloneNow =
            window.matchMedia("(display-mode: standalone)").matches ||
            window.navigator.standalone === true;

          if (isIOS && standaloneNow) {
            document.documentElement.classList.add("is-ios-standalone-pwa");
          }

          var screenHeight = window.screen.height;
          var viewportHeight = window.innerHeight;
          var viewportGap = screenHeight - viewportHeight;
          var reloadGuardPresent = getReloadGuardPresent();
          var isBroken =
            isIOS &&
            standaloneNow &&
            window.innerWidth < 768 &&
            viewportGap > 40;

          debugViewport({
            isIOS: isIOS,
            standaloneNow: standaloneNow,
            screenHeight: screenHeight,
            innerHeight: window.innerHeight,
            visualViewportHeight: window.visualViewport
              ? window.visualViewport.height
              : undefined,
            visualViewportOffsetTop: window.visualViewport
              ? window.visualViewport.offsetTop
              : undefined,
            viewportGap: viewportGap,
            reloadGuardPresent: reloadGuardPresent
          });

          if (isBroken && !reloadGuardPresent) {
            if (setReloadGuard()) {
              window.location.reload();
            }
            return;
          }

          if (!isBroken) {
            clearReloadGuard();
          }
        }

        window.addEventListener(
          "pageshow",
          function () {
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                setTimeout(stabilizeStandaloneViewport, 200);
              });
            });
          },
          { once: true }
        );
      })();
    </script>

    <link rel="manifest" href="/assets/favicon/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/favicon/assets/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <meta name="theme-color" content="#7c3aed" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Recolekt" />

    <link rel="preconnect" href="https://api.recolekt.app" crossorigin />
    <link rel="preconnect" href="https://storage.googleapis.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
