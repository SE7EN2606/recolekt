[build]
command = "npm run build"
publish = "dist"

[[headers]]
for = "/assets/*.js"
[headers.values]
Content-Type = "application/javascript; charset=utf-8"

[[headers]]
for = "/assets/*.css"
[headers.values]
Content-Type = "text/css; charset=utf-8"

# 1) Proxy API through the SAME Netlify site (recolekt.app)
# Browser calls https://recolekt.app/api/*, Netlify forwards to your API host.
[[redirects]]
from = "/api/*"
to = "https://api.recolekt.app/api/:splat"
status = 200
force = true

# 2) Redirect Netlify subdomain to your custom domain (keep path/query)
[[redirects]]
from = "https://recolekt-front.netlify.app/*"
to = "https://recolekt.app/:splat"
status = 301
force = true

# 3) SPA fallback for React Router (deep links like /gallery)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
