[build]
command = "npm run build"
publish = "dist"

[[headers]]
for = "/assets/*.js"
[headers.values]
Content-Type = "application/javascript; charset=utf-8"

[[headers]]
for = "/assets/*.css"
[headers.values]
Content-Type = "text/css; charset=utf-8"

# Proxy API calls through Netlify (removes CORS + fixes cookie issues)
[[redirects]]
from = "/api/*"
to = "https://YOUR-RAILWAY-APP.up.railway.app/api/:splat"
status = 200
force = true

# Redirect Netlify subdomain to your custom domain (keep path/query)
[[redirects]]
from = "https://recolekt-front.netlify.app/*"
to = "https://recolekt.app/:splat"
status = 301
force = true

# SPA fallback for React Router (deep links like /gallery)
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
